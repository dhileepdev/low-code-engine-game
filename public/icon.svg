<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <g transform="translate(106, 96)">
    <!-- 3D Cube Isometric Puzzle Icon -->
    <path d="M150 20 L270 90 L270 230 L150 300 L30 230 L30 90 Z" fill="#1e293b" stroke="#475569" stroke-width="6" />
    <!-- Top Face -->
    <path d="M150 20 L270 90 L150 160 L30 90 Z" fill="url(#glow)" opacity="0.9" />
    <!-- Left Face -->
    <path d="M30 90 L150 160 L150 300 L30 230 Z" fill="url(#cube)" />
    <!-- Right Face -->
    <path d="M150 160 L270 90 L270 230 L150 300 Z" fill="#4f46e5" />
    <!-- Node logic lines -->
    <circle cx="150" cy="90" r="14" fill="#a5f3fc" />
    <circle cx="90" cy="195" r="10" fill="#fef08a" />
    <circle cx="210" cy="195" r="10" fill="#f472b6" />
    <path d="M150 90 L90 195 M150 90 L210 195" stroke="#ffffff" stroke-width="5" stroke-dasharray="6,4" />
  </g>
</svg>
